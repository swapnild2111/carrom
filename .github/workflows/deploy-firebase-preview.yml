name: Deploy Astro to Firebase preview

# Builds the /astro project and deploys it to a Firebase Hosting preview
# channel so we can validate the Firestore-hydrated site without touching
# the live Hugo/GitHub Pages deployment.
#
# Trigger: manual dispatch or push to the /astro subtree on main.
# The preview URL is echoed in the job output.
#
# Requires a repo secret named FIREBASE_SERVICE_ACCOUNT_CARROM_THANE
# holding a service-account JSON with "Firebase Hosting Admin" role.

on:
  push:
    branches: [main]
    paths:
      - "astro/**"
      - ".github/workflows/deploy-firebase-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        working-directory: astro
        run: npm ci || npm install

      - name: Build Astro
        working-directory: astro
        run: npm run build

      - name: Deploy to Firebase preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARROM_THANE }}
          projectId: carrom-thane
          entryPoint: astro
          channelId: astro-preview
          expires: 30d
