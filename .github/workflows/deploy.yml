name: Deploy Astro to Firebase Hosting

# Builds the Astro site with Firestore data baked in and deploys to the
# LIVE Firebase Hosting channel at https://carrom-thane.web.app.
#
# Runs on any push to main (any file change) and on manual dispatch.
# Firestore data is fetched at build time via the Firebase Admin SDK, so
# admin edits will show up on the public site on the NEXT deploy — a push
# to main is the trigger.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        working-directory: astro
        run: npm ci || npm install

      - name: Build Astro (with Firestore data baked in)
        working-directory: astro
        env:
          # firestore-server.ts reads this to fetch data during build.
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARROM_THANE }}
        run: npm run build

      - name: Deploy to Firebase Hosting live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARROM_THANE }}
          projectId: carrom-thane
          entryPoint: astro
          channelId: live
