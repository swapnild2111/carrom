name: Auto-publish on admin edits

# Polls Firestore every 5 minutes for a `dirty` flag set by the admin client
# after any write. If the flag is set AND the last publish is older than the
# latest dirty timestamp, this rebuilds the Astro site and deploys to the
# Firebase Hosting live channel — the same build+deploy path as deploy.yml.
#
# Result: admin edits reach the public site within ~5 minutes without any
# manual action.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install firebase-admin
        run: pip install firebase-admin

      - name: Write service-account JSON
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARROM_THANE }}
        run: |
          echo "$SA_JSON" > /tmp/sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> "$GITHUB_ENV"

      - name: Check if publish is needed
        id: check
        run: |
          python <<'EOF'
          import os, sys, firebase_admin
          from firebase_admin import credentials, firestore

          firebase_admin.initialize_app(credentials.ApplicationDefault(), {"projectId": "carrom-thane"})
          db = firestore.client()

          snap = db.collection("system").document("publish_status").get()
          if not snap.exists:
              print("No publish_status doc yet — nothing to publish.")
              needs = False
          else:
              d = snap.to_dict() or {}
              dirty = bool(d.get("dirty"))
              dirty_at = d.get("dirtyAt")
              last_pub = d.get("lastPublishedAt")
              needs = dirty and (last_pub is None or (dirty_at and dirty_at > last_pub))
              print(f"dirty={dirty} dirtyAt={dirty_at} lastPublishedAt={last_pub} → needs_publish={needs}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"needs_publish={'true' if needs else 'false'}\n")
          EOF

      - uses: actions/setup-node@v4
        if: steps.check.outputs.needs_publish == 'true'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: astro/package-lock.json

      - name: Install Astro dependencies
        if: steps.check.outputs.needs_publish == 'true'
        working-directory: astro
        run: npm ci || npm install

      - name: Build Astro (with Firestore data baked in)
        if: steps.check.outputs.needs_publish == 'true'
        working-directory: astro
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARROM_THANE }}
        run: npm run build

      - name: Deploy to Firebase Hosting live channel
        if: steps.check.outputs.needs_publish == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARROM_THANE }}
          projectId: carrom-thane
          entryPoint: astro
          channelId: live

      - name: Mark publish_status as clean
        if: steps.check.outputs.needs_publish == 'true'
        run: |
          python <<'EOF'
          import firebase_admin
          from firebase_admin import credentials, firestore

          firebase_admin.initialize_app(credentials.ApplicationDefault(), {"projectId": "carrom-thane"})
          db = firestore.client()

          db.collection("system").document("publish_status").set({
              "dirty": False,
              "lastPublishedAt": firestore.SERVER_TIMESTAMP,
              "lastPublishedBy": "auto-publish-workflow",
          }, merge=True)
          print("✓ Cleared dirty flag.")
          EOF
